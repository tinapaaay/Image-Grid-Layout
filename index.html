<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Image Grid Layout</title>
  <meta
    name="description"
    content="A responsive image gallery built with CSS Grid."
  >

  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main>
    <header>
      <p class="eyebrow">CSS Grid practice</p>
      <h1>Places and Spaces</h1>
      <p>A responsive image gallery built using HTML and CSS.</p>
    </header>

    <section class="gallery" aria-label="Image gallery">
      <figure class="gallery-item item-one">
        <img src="images/beach-rock.jpeg" alt="A foggy beach with a rock formation">
      </figure>

      <figure class="gallery-item item-two">
        <img src="images/living-room.webp" alt="A living room with a white couch">
      </figure>

      <figure class="gallery-item item-three">
        <img src="images/food.avif" alt="A table with plates and bowls of food">
      </figure>

      <figure class="gallery-item item-four">
        <img src="images/red-door.jpg" alt="A building with a red door">
      </figure>

      <figure class="gallery-item item-five">
        <img src="images/apartments.jpeg" alt="White apartment buildings beside a street">
      </figure>

      <figure class="gallery-item item-six">
        <img src="images/hill-beach.jpeg" alt="A beach seen from the top of a hill">
      </figure>
    </section>
  </main>
</body>
</html>
